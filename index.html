<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحوم ❤️ مريم</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffffff;--bg2:#ffe9f0;--gold1:#a87420;--gold2:#e2b24f;--rose:#d63a6b;--ink:#43202f;--soft:#7a5565;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 25%,var(--bg1),var(--bg2) 85%);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.glow{position:fixed;left:50%;top:42%;width:75vmin;height:75vmin;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,120,160,.25),transparent 65%);filter:blur(24px);animation:breathe 7s ease-in-out infinite;z-index:0}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.2);opacity:.65}}
.scene{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;padding:2rem 1.5rem;text-align:center;opacity:0;visibility:hidden;filter:blur(16px);transform:scale(1.06);transition:opacity 1.3s ease,filter 1.3s ease,transform 1.7s cubic-bezier(.2,.8,.2,1),visibility 0s 1.3s}
.scene.on{opacity:1;visibility:visible;filter:none;transform:none;transition:opacity 1.3s ease .3s,filter 1.3s ease .3s,transform 1.7s cubic-bezier(.2,.8,.2,1) .3s}
.gold{background:linear-gradient(100deg,var(--gold1) 20%,var(--gold2) 45%,var(--gold1) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.name{font-family:'Aref Ruqaa',serif;font-size:clamp(5rem,24vw,10rem);font-weight:700;line-height:1.3;margin:0}
.sub{font-size:clamp(1.05rem,4vw,1.35rem);color:var(--soft);line-height:1.9;font-weight:600}
.line{font-size:clamp(1.35rem,5.4vw,2.3rem);font-weight:700;line-height:1.9;margin:0;max-width:21ch;text-wrap:balance;color:var(--ink)}
.line+.line{color:var(--rose);margin-top:.2rem}
.w{display:inline-block;opacity:0;transform:translateY(22px) scale(.92);filter:blur(7px);transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.8,.2,1),filter 1s ease;transition-delay:var(--d)}
.on .w{opacity:1;transform:none;filter:none}
.btn{font-family:inherit;font-size:1.15rem;font-weight:700;border:0;border-radius:60px;padding:.9rem 2.4rem;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff6b97,#d63a6b);box-shadow:0 8px 28px rgba(214,58,107,.35);transition:transform .35s,box-shadow .35s}
.btn:hover{transform:scale(1.07);box-shadow:0 12px 36px rgba(214,58,107,.5)}
.btn.ghost{background:#fff;border:1.5px solid var(--gold1);color:var(--gold1);box-shadow:none}
.btn.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,58,107,.5)}70%,100%{box-shadow:0 0 0 20px rgba(214,58,107,0)}}
.big{font-size:5.5rem;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px) rotate(4deg)}}
.row{display:flex;gap:1.2rem;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:1rem;min-height:70px}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold1);background:rgba(255,255,255,.8);font-size:1.2rem;cursor:pointer;display:none}
@media (prefers-reduced-motion:reduce){.glow,.gold,.big{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas><div class="glow"></div>
<button id="mute" aria-label="الصوت">🔊</button>

<section class="scene on" id="s0">
 <div class="big">🎁</div>
 <p class="line" id="t0"></p>
 <div class="sub">شغّلي الصوت وافتحيها 🌹</div>
 <button class="btn pulse" id="open">افتحي الهدية</button>
 <label class="btn ghost" id="pick" style="font-size:.85rem;padding:.5rem 1.2rem;margin-top:.4rem">🎵 اختاري ملف الأغنية<input type="file" id="song" accept="audio/*" hidden></label>
</section>

<section class="scene" id="s1">
 <h1 class="name gold">مريم</h1>
 <div class="sub"><span class="w" style="--d:1.2s">إلى أغلى وأجمل ما بحياتي</span></div>
</section>

<div id="dyn"></div>

<section class="scene" id="q">
 <div class="big">💍</div>
 <h1 class="name gold" style="font-size:clamp(3.4rem,16vw,7rem)">مريم…</h1>
 <p class="line"><span class="w" style="--d:1.2s">تتزوجيني؟</span></p>
 <div class="row"><button class="btn" id="yes">أوافق ❤️</button><button class="btn ghost" id="no">لا</button></div>
</section>

<section class="scene" id="end">
 <div class="big">💞</div>
 <h1 class="name gold">وافقتي</h1>
 <p class="line"><span class="w" style="--d:1s">بدت قصة العمر كله</span></p>
 <p class="line" style="font-size:1.1rem;color:var(--soft)"><span class="w" style="--d:2s">الله يديم المحبة بيناتنا ويجعله بيت مليان رحمة ومودة 🤲</span></p>
 <div class="sub gold" style="font-size:1.7rem"><span class="w" style="--d:3s">رحوم ❤️ مريم</span></div>
</section>

<script>
const SONG="";
// ---------- النصوص ----------
const S=[
 ["من يوم ما عرفتچ…","كل شي بعيني صار أحلى ✨"],
 ["ضحكتچ أحلى صوت أسمعه","وعيونچ البيت اللي أرتاح بيه 🤍"],
 ["أشكرچ على وقوفچ ويايه","وعلى صبرچ وطيبة قلبچ وحنانچ"],
 ["أشكر ربي لأنه جمعني بيچ","وكل يوم وياچ أحسه نعمة 🌹"],
 ["أتمنالچ كل الخير بالدنيا","وأن الله يحفظچ ويفرّحچ دايماً 🤲"],
 ["وأتمنى أكون سندچ وأمانچ","ونبني بيت كله حب ومودة 🏡"],
 ["وأني وياچ مو بس أحبچ…","أريد أكمل عمري كله وياچ ❤️"]
];
function words(txt,d){return txt.split(' ').map(w=>{d.v+=.28;return `<span class="w" style="--d:${d.v.toFixed(2)}s">${w}</span>`}).join(' ')}
const order=['s0','s1'],dur={s1:6000};
let h='';
S.forEach((l,i)=>{
 const d={v:.8};const id='x'+i;
 h+=`<section class="scene" id="${id}">${l.map(t=>{const p=`<p class="line">${words(t,d)}</p>`;d.v+=.5;return p}).join('')}</section>`;
 order.push(id);dur[id]=Math.round((d.v+3.2)*1000);
});
document.getElementById('dyn').innerHTML=h;order.push('q');
document.getElementById('t0').innerHTML=words('هاي الهدية إلچ يا مريم',{v:.4});

let cur=0;
const show=id=>{document.querySelectorAll('.scene.on').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on')};
function next(){cur++;show(order[cur]);if(dur[order[cur]])setTimeout(next,dur[order[cur]])}

// ---------- الموسيقى ----------
let ac,master,on=false,nextT=0,bar=0,pickUrl=null;
const chords=[[110,220,261.63,329.63,440],[87.31,174.61,261.63,349.23,440],[130.81,196,261.63,329.63,392],[98,196,246.94,293.66,392]];
const pat=[1,2,3,4,3,2,3,4];
function note(f,t,d,v,ty){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.1)}
function sched(){while(nextT<ac.currentTime+2){const c=chords[bar%4];note(c[0],nextT,3.4,.10,'sine');pat.forEach((p,i)=>note(c[p],nextT+i*.4,1.6,.07,'triangle'));nextT+=3.2;bar++}}
function synth(){try{const A=window.AudioContext||window.webkitAudioContext;ac=new A();master=ac.createGain();master.gain.value=.35;const dl=ac.createDelay();dl.delayTime.value=.42;const fb=ac.createGain();fb.gain.value=.45;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;master.connect(ac.destination);master.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(ac.destination);nextT=ac.currentTime+.1;sched();setInterval(sched,800);on=true;const m=document.getElementById('mute');m.style.display='block';m.onclick=()=>{if(on){ac.suspend();m.textContent='🔇'}else{ac.resume();m.textContent='🔊'}on=!on}}catch(e){}}
document.getElementById('song').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;pickUrl=URL.createObjectURL(f);document.getElementById('pick').firstChild.textContent='✅ '+f.name})
function startMusic(){
 const au=new Audio(pickUrl||SONG||'salvatore.mp3');au.loop=true;au.volume=.5;
 au.play().then(()=>{const m=document.getElementById('mute');m.style.display='block';m.onclick=()=>{if(au.paused){au.play();m.textContent='🔊'}else{au.pause();m.textContent='🔇'}}}).catch(synth);
}

// ---------- الكانفاس ----------
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H,dpr=Math.min(devicePixelRatio||1,2);
function rs(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
rs();addEventListener('resize',rs);
const rnd=(a,b)=>a+Math.random()*(b-a);
const cols=['#ff7aa2','#e8478a','#d63a6b','#ff9fbd','#f7b6c8'];
function mk(init){return{x:rnd(0,W),y:init?rnd(-H,H):rnd(-60,-10),s:rnd(8,18),vy:rnd(.5,1.3),vx:rnd(-.4,.4),r:rnd(0,6.28),vr:rnd(-.03,.03),sw:rnd(0,6.28),c:cols[Math.random()*cols.length|0],rose:Math.random()<.12}}
const petals=[...Array(45)].map(()=>mk(true));
const stars=[...Array(40)].map(()=>({x:rnd(0,1),y:rnd(0,1),r:rnd(.6,1.8),p:rnd(0,6.28)}));
let fw=[];
function boom(px,py){const h=rnd(0,360);for(let i=0;i<70;i++){const a=rnd(0,6.28),s=rnd(1,6);fw.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:`hsl(${h+rnd(-30,30)},90%,55%)`})}}
function loop(t){
 x.clearRect(0,0,W,H);
 stars.forEach(s=>{x.globalAlpha=.15+.5*Math.abs(Math.sin(t/1000+s.p));x.fillStyle='#e2b24f';x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,6.28);x.fill()});
 petals.forEach((p,i)=>{p.y+=p.vy;p.sw+=.02;p.x+=p.vx+Math.sin(p.sw)*.7;p.r+=p.vr;if(p.y>H+30)petals[i]=mk(false);
  x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=.85;
  if(p.rose){x.font=p.s*1.6+'px serif';x.fillText('🌹',0,0)}else{x.fillStyle=p.c;x.beginPath();x.moveTo(0,-p.s);x.bezierCurveTo(p.s,-p.s*.6,p.s*.8,p.s*.7,0,p.s);x.bezierCurveTo(-p.s*.8,p.s*.7,-p.s,-p.s*.6,0,-p.s);x.fill()}
  x.restore()});
 fw=fw.filter(p=>p.l>0);
 fw.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.l-=.011;x.globalAlpha=Math.max(p.l,0);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,2.5,0,6.28);x.fill()});
 x.globalAlpha=1;requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// ---------- الأزرار ----------
document.getElementById('open').addEventListener('click',()=>{startMusic();next()},{once:true});
const no=document.getElementById('no'),yes=document.getElementById('yes');
const msgs=['لا؟ 🥺','فكري مرة ثانية','لا تكسرين قلبي 💔','مو معقولة 😭','اضغطي أوافق 😍'];
let ns=0,scale=1,placed=false;
function dodge(e){e.preventDefault();if(!placed){no.style.position='fixed';placed=true}
 no.style.left=rnd(10,W-no.offsetWidth-10)+'px';no.style.top=rnd(80,H-no.offsetHeight-20)+'px';no.style.zIndex=6;
 no.textContent=msgs[ns++%msgs.length];scale=Math.min(scale+.12,2);yes.style.transform=`scale(${scale})`}
no.addEventListener('mouseover',dodge);no.addEventListener('touchstart',dodge,{passive:false});no.addEventListener('click',dodge);
yes.addEventListener('click',()=>{
 show('end');no.style.display='none';
 for(let i=0;i<22;i++)setTimeout(()=>boom(rnd(W*.15,W*.85),rnd(H*.12,H*.55)),i*350);
 for(let i=0;i<60;i++)petals.push(mk(false));
 setInterval(()=>boom(rnd(W*.15,W*.85),rnd(H*.12,H*.55)),1800);
});
</script>
</body>
</html>
